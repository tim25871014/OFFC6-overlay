<!DOCTYPE html>
<html lang="zh-tw">

<head>
    <script src="../_data/deps/vue.global.prod.js"></script>
    <script src="../_data/deps/connection.js"></script>
    <script src="../_data/deps/tailwind.min.js"></script>
    <link rel="stylesheet" href="../_data/deps/style.css">
</head>

<body>
    <div id="main" class="absolute h-[1080px] w-[1920px] text-white">

        <div id="background-img">
            <video autoplay loop class="absolute top-0 left-0 -z-20">
                <source src="../_data/video/intro.mp4" type="video/mp4" />
            </video>
            <video v-show="winner === 'red'" autoplay loop class="absolute top-0 left-0 -z-10">
                <source src="../_data/video/winner_red.mp4" type="video/mp4" />
            </video>
            <video v-show="winner === 'blue'" autoplay loop class="absolute top-0 left-0 -z-10">
                <source src="../_data/video/winner_blue.mp4" type="video/mp4" />
            </video>
        </div>

        <div id="header" class="flex h-[156px] w-full relative">
            <div id="stage" class="absolute top-[140px] left-[50%] transform -translate-x-1/2 font-rog text-[25px]">
                {{ Stage }}
            </div>
        </div>

        <div id="content" class="h-[720px] w-full flex flex-col items-center gap-5 mt-5">
            <div class="font-rog text-[100px]">WINNER</div>
            <div class="w-[1200px] h-[85px] bg-linear-to-r flex items-center justify-center"
            :class="(winner == 'red') ? 'from-transparent via-[#600000]/80 to-transparent' : (winner === 'blue') ? 'from-transparent via-[#000090]/80 to-transparent' : 'from-transparent via-[#555555]/80 to-transparent'"
            >
                <p class="font-rog text-[50px] transform translate-y-[-5px]">{{ (winner === 'red') ? teams.red : (winner === 'blue') ? teams.blue : 'None' }}</p>
            </div>

            <div class="w-full h-full flex gap-10 justify-center">
                <div class="w-[520px] h-full relative">
                    <div class="absolute top-0 left-0 w-[35px] h-[35px] rounded-full"
                        :class="(winner == 'red') ? 'bg-[#ff9d8e]' : (winner === 'blue') ? 'bg-[#96bcff]' : 'bg-[#555555]'"
                    ></div>
                    <div id="border" class="absolute top-[20px] left-[20px] w-[490px] h-[375px] border-[12px] rounded-[70px]"
                        :class="(winner == 'red') ? 'border-[#ff9d8e]' : (winner === 'blue') ? 'border-[#96bcff]' : 'border-[#555555]'"
                    ></div>
                    <div id="avatar" class="w-[440px] h-[330px] absolute top-[42px] left-[45px] rounded-[50px] bg-cover bg-center"
                        :style="(winner === 'red') ? { backgroundImage: `url(${avatar.red})` } : { backgroundImage: `url(${avatar.blue})` }">
                    </div>
                </div>
                <div id="score" class="w-auto h-full py-[22px] space-y-[3px]">
                    <div v-for="(player, idx) in (winner === 'red') ? redPlayers : bluePlayers"
                        class="flex flex-row gap-[10px]"
                    >
                        <div class="rounded-full w-[56px] h-[56px] bg-cover bg-center"
                            :style="{ backgroundImage: `url(${player.avatarUrl})` }">
                        </div>
                        <p class="font-lexend-exblack text-[40px]">{{ player.userName }}</p>
                    </div>
                </div>
            </div>

        </div>

        <div id="footer" class="relative bottom-0 flex h-[204px] w-full px-[20px] items-center justify-center">
            <h1 class="font-rog text-[100px]">朱芷琳</h1>
        </div>


    </div>
</body>
<script src="./script.js"></script>

</html>
