<!DOCTYPE html>
<html lang="zh-tw">
<head>
    <script src="../_data/deps/vue.global.prod.js"></script>
    <script src="../_data/deps/connection.js"></script>
    <script src="../_data/deps/tailwind.min.js"></script>
    <link rel="stylesheet" href="../_data/deps/style.css">
</head>
<body>
<div id="main" class="absolute h-[1080px] w-[1920px] text-white">

    <video autoplay loop class="absolute top-0 left-0 -z-10">
        <source src="../_data/video/actions.mp4" type="video/mp4" />
    </video>

    <div id="header" class="flex h-[156px] w-full relative">
        <div id="stage" class="absolute top-[140px] left-[50%] transform -translate-x-1/2 font-rog text-[25px]"> {{ Stage }} </div>

        <div class="absolute top-0 left-0 h-[1080px] w-[14px] bg-[#7ba4af] scanline"></div>
        <div class="absolute top-0 right-0 h-[1080px] w-[14px] bg-[#7ba4af] scanline"></div>

        <div id="team-info" class="flex justify-between flex-row w-full mx-10 my-7">
            <div id="red-info" class="flex flex-row text-left relative">
                <div class="flex flex-col gap-1 relative">
                    <div id="red-avatar" class="w-[140px] h-[105px] border-[3.5px] border-red-950 bg-red-950 rounded-[10px] rounded-tr-none bg-cover bg-center"
                        :style="{ backgroundImage: `url(${RedTeamAvatar})` }">
                    </div>
                </div>
                <div class="flex flex-col gap-1">
                    <p class="px-4 text-[32px] h-[48px] w-[440px] font-rog bg-gradient-to-r from-red-950 to-transparent">{{ RedTeamName }}</p>
                    <div class="red-hp-bar relative w-[250px] h-[44px] transform translate-x-[10px] flex items-center">
                        <div class="absolute size-[100%] rounded-[10px] transition-[width] duration-300 ease-out"
                            :style="{
                                transform: 'skewX(-10deg)',
                                width: RedTeamHPPercent + '%',
                                height: (RedTeamHPPercent < 7) ? '85%' : '100%',
                                backgroundColor: hpColor(RedTeamHPPercent)
                            }"></div>
                        <div class="absolute size-[100%] rounded-[10px] border-[3px] border-white"
                            :style="{ transform: 'skewX(-10deg)' }"></div>
                        <p class="text-2xl absolute font-lexend-black text-shadow-lg text-white top-[50%] left-[50%] transform -translate-x-1/2 -translate-y-1/2">{{ RedTeamHP }}</p>
                    </div>
                </div>
            </div>

            <div id="blue-info" class="flex flex-row-reverse text-right">
                <div class="flex flex-col gap-1 relative">
                    <div id="blue-avatar" class="w-[140px] h-[105px] border-[3.5px] border-blue-950 bg-blue-950 rounded-[10px] rounded-tl-none bg-cover bg-center"
                        :style="{ backgroundImage: `url(${BlueTeamAvatar})` }">
                    </div>
                </div>
                <div class="flex flex-col gap-1 items-end">
                    <p class="px-4 text-[32px] h-[48px] w-[440px] font-rog bg-gradient-to-l from-blue-950 to-transparent">{{ BlueTeamName }}</p>
                    <div class="blue-hp-bar relative w-[250px] h-[44px] transform translate-x-[-10px]">
                        <div class="absolute size-[100%] rounded-[10px] transition-[width] duration-300 ease-out"
                            :style="{
                                transform: 'skewX(10deg)',
                                right: '0',
                                width: BlueTeamHPPercent + '%',
                                height: (BlueTeamHPPercent < 7) ? '85%' : '100%',
                                backgroundColor: hpColor(BlueTeamHPPercent)
                            }"></div>
                        <div class="absolute size-[100%] rounded-[10px] border-[3px] border-white"
                            :style="{ transform: 'skewX(10deg)' }"></div>
                        <p class="text-2xl absolute font-lexend-black text-shadow-lg text-white top-[50%] left-[50%] transform -translate-x-1/2 -translate-y-1/2">{{ BlueTeamHP }}</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="content" class="h-[720px] w-full flex flex-row">

        <div id="red-bd" class="w-[121px] h-full bg-red-500"></div>
        <div id="red-picks" class="w-[500px] h-full bg-slate-400"></div>
        <div id="cards" class="w-[678px] h-full bg-yellow-500"></div>
        <div id="blue-picks" class="w-[500px] h-full bg-slate-400"></div>
        <div id="blue-bd" class="w-[121px] h-full bg-blue-500"></div>
        
    </div>

    <div id="footer" class="relative bottom-0 flex h-[204px] w-full px-[20px]">

        <div id="chat" class="absolute top-0 left-[50%] transform -translate-x-1/2 h-full w-[678px]">
              <div id="chat-content" class="pt-[10px] h-full w-full border-[3px] border-[#7ba4af] rounded-[7px] bg-black transition-opacity duration-300" :class="showChat ? 'opacity-100' : 'opacity-0 pointer-events-none'">
                  <div class="flex h-full flex-col-reverse overflow-hidden text-[16px] p-2 text-white">
                      <div v-for="(msg, idx) in messages" :key="`${msg.timestamp}-${idx}`" class="flex gap-2">
                          <span class="text-gray-300 font-lexend-regular">{{ msg.timestamp }}</span>
                             <span class="font-lexend-black"
                                 :class="msg.team === 'left' ? 'text-red-400' : msg.team === 'right' ? 'text-blue-400' : 'text-gray-400'">
                                 {{ msg.name }}
                             </span>
                          <span class="font-tpsans-regular break-words overflow-hidden">{{ msg.message }}</span>
                      </div>
                  </div>
              </div>
        </div>

    </div>

</div>

<div id="control-panel" class="absolute left-[1950px] flex gap-3 m-4 text-white flex-col">
    <button class="bg-black size-25" @click="toggleComboMode">Combo Mode: {{ comboMode }}</button>
    <button class="bg-black size-25" @click="toggleChat">Force Chat: {{ chatMode }}</button>
</div>

<style>
    @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.6; }
    }
    .blink-anim {
        animation: blink 0.8s 3 ease-in-out;
    }
</style>

<script src="./script.js" defer></script>

</body>
</html>
