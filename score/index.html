<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <script src="../_data/deps/vue.global.prod.js"></script>
    <script src="../_data/deps/connection.js"></script>
    <script src="../_data/deps/tailwind.min.js"></script>
</head>

<body>
    <div id="app" class="flex min-h-screen w-[1920px] flex-col text-slate-100">
        <div id="main" class="flex justify-center">
            <div class="relative h-[1080px] w-[1920px] bg-black">
                <pre id="game-status" class="absolute left-3 top-3 h-[1080px] w-[560px] whitespace-pre-wrap text-[18px] text-white truncate"></pre>
                <pre id="game-event" class="absolute left-[600px] h-[1080px] top-3 w-[560px] whitespace-pre-wrap text-[18px] text-white truncate"></pre>
            </div>
        </div>

        <div id="control" class="flex flex-wrap items-center gap-3 bg-slate-800 px-4 py-3 text-[30px]">
            <button @click="refreshInstances" class="bg-amber-200 p-2 text-black">重新整理清單</button>

            <label class="flex items-center gap-3">
                index.html
                <select
                    class="rounded bg-slate-100 px-3 py-2 text-slate-900"
                    :disabled="!instanceList.length" v-model="selectedInstanceId" @change="handleInstanceChange">
                    <option value="" disabled>
                        {{ instanceList.length ? '請選擇一個已連線的 index.html' : '尚未偵測到任何 index.html' }}
                    </option>
                    <option v-for="instance in instanceList" :key="instance.instanceId" :value="instance.instanceId">
                        {{ formatInstanceLabel(instance) }}
                    </option>
                </select>
            </label>

            <button @click="reconnect" class="bg-amber-200 p-2 text-black">重新連線</button>
        </div>

        <div class="flex w-[1920px] flex-wrap items-center justify-between gap-3 bg-slate-800 px-4 py-3 text-[30px]">
            <div class="flex items-center gap-3">
                <span class="h-[30px] w-[30px] rounded-full" :class="statusDotClass"></span>
                <span>{{ connectionStatus }}</span>
            </div>
            <div class="flex items-center gap-3">
                <span>{{ snapshotStatus }}</span>
                <span>{{ eventStatus }}</span>
            </div>
        </div>
    </div>

   
    <script src="./render.js" defer></script>
    <script src="./score.js" defer></script>
</body>

</html>
